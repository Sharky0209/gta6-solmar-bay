<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solmar Bay — Make GTA 6 (r7)</title>
<style>
  html, body { margin: 0; padding: 0; background: #0b1220; color: #e8eef7;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  #wrap { position: relative; width: 1280px; max-width: 100vw; margin: 0 auto; }
  canvas { display: block; width: 100%; background: #12203a; }
  #start { position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 12px;
    background: rgba(5, 10, 20, 0.72); text-align: center; }
  #start h1 { margin: 0; font-size: 44px; letter-spacing: 2px; }
  #start p { margin: 0; opacity: 0.85; }
  #start button { padding: 10px 28px; font-size: 16px; cursor: pointer; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="1280" height="720"></canvas>
  <div id="start">
    <h1>SOLMAR BAY</h1>
    <p>Rook Calloway — open world. Walk, drive, take jobs, lose the heat.</p>
    <p>WASD move / drive &middot; E enter car &middot; Space brake &middot; mouse aim</p>
    <button id="start-btn" type="button">Start</button>
  </div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
